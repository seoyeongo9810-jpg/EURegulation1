    2040년까지 순 온실가스 배출을 1990년 대비 90% 감축하는 법적 구속력 있는 목표를 기후법에 추가한 개정.
    2036년부터 고품질 국제탄소크레딧을 최대 5%p까지 인정하고, ETS 대상 감축 곤란 배출 상쇄에 역내 영구 탄소제거 활용을 허용하며,
    ETS2(건물·도로수송) 시행을 2027년에서 2028년으로 1년 연기했다. 2년마다 진척 검토 후 목표 조정 제안이 가능하다.
    2026-07-17 ETS 개정안의 상한·선형감축률 설계 근거가 됐다.
