  summary: >
    폐차지침(2000/53/EC)과 3R 형식승인지침(2005/64/EC)을 대체하는 규정. 2025.12.12 잠정 합의 후 2026.6.18 유럽의회, 6.29 이사회 채택,
    7.8 서명, 7.24 관보 게재, 8.13 발효했으며 2028.9.1부터 일반 적용된다. 재활용 플라스틱 함량 의무(2032년 15%, 2036년 25%)를 두고,
    Commission이 위임법령으로 철강·알루미늄 재활용 함량 목표를 설정해 2033년부터 적용하도록 한다. 적용 범위가 트럭·버스·이륜차로 확대되고,
    2031년 중반부터 주행 가능 차량만 EU 밖으로 수출할 수 있다.
