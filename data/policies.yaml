- id: espr_steel
  name_ko: ESPR 철강 위임법령
  name_en: ESPR delegated act on iron and steel products
  status: pending
  stage: consultation
  legal_form: Delegated Act
  dg: GROW
  category: [product_footprint]
  steel_relevance: high
  summary: >
    ESPR에 따라 철강 제품의 에코디자인 요건을 정하는 위임규정. 2026.5.20~8.12 영향평가 Call for Evidence와 공개협의가 진행되어 마감되었다.
    검토 중인 정책 옵션은 (1) 탄소발자국·재활용 함량·재활용 저해 물질 정보 공개 의무, (2) 탄소발자국 기반 성능 등급·최소 성능 기준,
    (3) 공급망 전체의 디지털 제품여권(DPP)이다. Have Your Say상 위임법령 채택 계획 시기는 2026년 4분기이나, 위임법령 초안 피드백은 아직 게시되지 않았다.
    산업가속화법(IAA) 제안의 저탄소 철강 정의가 이 위임법령과 연계될 것으로 보도되었다.
  requirements:
    - type: carbon_footprint
      text: 철강 제품 탄소발자국 산정·공개 및 탄소발자국 기반 성능 등급·최소 기준(옵션)
    - type: product_info
      text: 재활용 함량, 재활용 저해 물질 정보 공개(옵션)
    - type: product_info
      text: 공급망 전체 디지털 제품여권(DPP) 요건(옵션)
    - type: labelling
      text: 성능 등급 표시 가능성(옵션 확정 전)
  scope: "EU 시장에 출시되는 철강 제품(구체적 품목 범위는 초안 공개 후 확정)"
  sub_acts:
    - "Regulation (EU) 2024/1781 (모법)"
  milestones:
    - date: 2026-04-15
      label: Have Your Say 이니셔티브 등록
    - date: 2026-05-20
      label: Call for Evidence·공개협의 개시
    - date: 2026-08-12
      label: Call for Evidence·공개협의 마감
  consultations:
    - type: call_for_evidence
      title: "Commission Delegated Regulation establishing ecodesign requirements for sustainable and circular 'iron and steel' products under Regulation (EU) 2024/1781 of the European Parliament and of the Council"
      start: 2026-05-20
      end: 2026-08-12
      summary: 영향평가용 Call for Evidence(Ares(2026)5076198). 탄소발자국·재활용 함량 정보 요건, 성능 등급, DPP 등 정책 옵션 제시.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17672-Ecodesign-requirements-for-iron-and-steel-products_en"
    - type: public_consultation
      title: "Public consultation for the impact assessment on ecodesign requirements for iron and steel products"
      start: 2026-05-20
      end: 2026-08-12
      summary: 철강 에코디자인 요건 영향평가를 위한 공개 설문.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17672-Ecodesign-requirements-for-iron-and-steel-products_en"
  impact:
    eu_producers:
      level: high
      obligations: 채택 시 제품 단위 탄소발자국·재활용 함량 공개, 성능 기준·DPP 준수
      preparation: 제품 단위 LCA 데이터, ETS 데이터와의 정합성 확보
      opportunities: 저탄소 제품의 등급 차별화
    non_eu_producers:
      level: high
      obligations: EU 시장 출시 제품에 동일 적용, 최소 성능 기준 도입 시 미달 제품 판매 제한 가능
      preparation: 제품 단위 탄소발자국 산정·검증, 스크랩 사용률 데이터, DPP 대응
      opportunities: 저탄소 제품 보유 시 등급 기반 프리미엄 확보
    korea_note: >
      한국 철강사에 가장 직접적인 제품 규제 후보. CBAM은 설비 단위 내재배출량이지만 ESPR은 제품 단위 탄소발자국과 등급을 요구할 수 있어
      산정 방법론 차이에 대비해야 한다. 최소 성능 기준(옵션 2)이 채택되면 고로재 비중이 높은 수출품의 시장 접근에 직접 영향이 있다.
      위임법령 초안 피드백(4주 예상) 공개 시 산정 방법론·전환기간에 의견을 내는 것이 중요하다.
  links:
    commission: "https://environment.ec.europa.eu/strategy/circular-economy/ecodesign-sustainable-products-regulation_en"
    have_your_say: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17672-Ecodesign-requirements-for-iron-and-steel-products_en"
  related: [espr, industrial_accelerator_act, cbam]
  verify_needed: true
  note: >
    Have Your Say상 채택 계획(2026 Q4)은 예정이며 위임법령 초안 피드백 기간·일자 미공개. 적용 시점(ESPR상 원칙적으로 발효 후 18개월 이후)과
    정책 옵션 최종 선택은 미확정. 정책 옵션 요약은 2차 출처 기반.
  last_verified: 2026-10-27

