- id: eu_ets
  name_ko: EU 배출권거래제
  name_en: EU Emissions Trading System (EU ETS)
  status: in_force
  stage: adopted
  legal_form: Directive
  legal_ref: "Directive 2003/87/EC (Directive (EU) 2023/959 등으로 개정)"
  dg: CLIMA
  category: [carbon_pricing_trade]
  steel_relevance: high
  effective_date: 2005-01-01
  summary: >
    EU 역내 고로·전기로·코크스·소결 설비 등 대규모 배출시설에 배출 상한(cap)을 두고 배출권을 거래하는 제도.
    현행법(2023/959 개정)상 CBAM 대상 품목(철강 포함)의 무상할당은 CBAM factor에 따라 2026년 97.5%에서
    2034년 0%로 단계적으로 줄어든다. 2026~2030 무상할당 벤치마크는 Implementing Regulation (EU) 2026/1412로
    확정됐다(2026-06-30 발효). 2031년 이후 체계는 2026-07-17 Commission 개정안(ets_review)에서 논의 중이다.
  requirements:
    - type: mrv
      text: 설비별 배출량 모니터링 계획 수립, 연간 배출량 보고 및 제3자 검증(MRR·AVR)
    - type: certificate
      text: 매년 검증된 전년도 배출량만큼 배출권 제출(제출 기한 9월 30일)
    - type: bat_limits
      text: "무상할당은 제품 벤치마크(2026~2030 값: 고로 용선 1.248, 코크스 0.143, 소결광 0.086, 전기로 탄소강 0.142, 전기로 고합금강 0.176 배출권/t) × 과거 활동량 기준"
    - type: mrv
      text: 에너지감사 권고 미이행 또는 (해당 설비) 기후중립계획 미수립 시 무상할당 20% 감액 조건(Art.10a(1))
  scope: "EU·EEA 역내 철강 생산시설(코크스, 소결, 선철·조강, 전기로, 압연·열처리 등 연소설비 포함)"
  sub_acts:
    - "Commission Implementing Regulation (EU) 2026/1412 — 2026~2030 무상할당 벤치마크 값 (2026-06-26 채택, OJ 2026-06-29)"
    - "Commission Delegated Regulation (EU) 2019/331 (무상할당 규칙, FAR) — Delegated Regulation (EU) 2024/873으로 개정(수소 직접환원 철강을 hot metal 벤치마크에 포함)"
    - "기후중립계획 내용·형식 이행규칙 C(2023)7298 (2023-10-31 채택)"
    - "Monitoring and Reporting Regulation (EU) 2018/2066, Accreditation and Verification Regulation (EU) 2018/2067"
  milestones:
    - date: 2026-01-01
      label: "CBAM 대상 부문 CBAM factor 97.5% 적용 시작(무상할당 2.5% 감축)"
    - date: 2026-06-30
      label: 2026~2030 벤치마크 이행규칙 (EU) 2026/1412 발효
    - date: 2026-09-30
      label: 2025년 배출량에 대한 배출권 제출 기한
    - date: 2027-01-01
      label: CBAM factor 95%
    - date: 2028-01-01
      label: "CBAM factor 90%, 선형감축률(LRF) 4.3%→4.4%"
    - date: 2030-01-01
      label: "CBAM factor 51.5% (현행법 기준)"
    - date: 2034-01-01
      label: "CBAM 대상 부문 무상할당 완전 폐지(CBAM factor 0%, 현행법 기준 — 개정안은 2038년으로 연장 제안)"
  consultations:
    - type: draft_act_feedback
      title: "COMMISSION IMPLEMENTING REGULATION (EU) …/... determining revised benchmark values for free allocation of emission allowances for the period from 2026 to 2030"
      start: 2026-05-11
      end: 2026-06-08
      summary: 2026~2030 무상할당 벤치마크 값 초안 의견수렴(442건). 철강 벤치마크 대부분이 2021~2025 대비 하향. 최종본은 (EU) 2026/1412로 채택.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15873-Revision-of-the-benchmark-values-for-free-allocation-of-emission-allowances-2026-2030-_en"
  impact:
    eu_producers:
      level: high
      obligations: 배출량 MRV, 매년 배출권 제출, 무상할당 조건(에너지감사·기후중립계획) 준수
      costs: 2026~2030 벤치마크 하향과 CBAM factor 축소로 무상할당 감소, 탄소비용 부담 증가
      preparation: 저탄소 공정(수소 DRI·전기로) 전환 투자와 배출권 조달·헤지 전략 수립
      opportunities: Innovation Fund 등 ETS 재원 기반 탈탄소 지원 활용
    non_eu_producers:
      level: medium
      obligations: ETS 직접 의무 없음. 단 CBAM 인증서 가격·무상할당 조정이 ETS 가격·벤치마크와 연동
      costs: ETS 벤치마크·CBAM factor가 CBAM 인증서 차감(무상할당 반영분) 규모를 결정해 간접 영향
      preparation: ETS 벤치마크 값과 CBAM factor 일정 모니터링
    korea_note: >
      한국 철강사는 ETS 직접 적용 대상이 아니지만, CBAM 인증서 가격이 ETS 배출권 가격에 연동되고 CBAM 인증서 의무량은
      ETS 무상할당(벤치마크 × CBAM factor) 만큼 조정된다. 2026~2030 벤치마크(고로 용선 1.248 등) 하향과 CBAM factor
      축소 일정은 EU 수출품의 CBAM 부담을 결정하는 핵심 변수이므로, 제품별 내재배출량을 EU 벤치마크와 비교·관리할 필요가 있다.
  links:
    commission: "https://climate.ec.europa.eu/areas-action/carbon-markets/about-eu-ets_en"
    eurlex: "https://eur-lex.europa.eu/eli/dir/2003/87/oj"
    have_your_say: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15873-Revision-of-the-benchmark-values-for-free-allocation-of-emission-allowances-2026-2030-_en"
    guidance: "https://climate.ec.europa.eu/areas-action/carbon-markets/eu-emissions-trading-system-eu-ets/free-allocation_en"
  related: [cbam, ets_review, ets_benchmarks_2026_2030, climate_law_2040]
  verify_needed: false
  note: >
    현행 CBAM factor 일정(2026 97.5%, 2027 95%, 2028 90%, 2029 77.5%, 2030 51.5%, 2031 39%, 2032 26.5%, 2033 14%, 2034 0%)은
    Directive 2003/87/EC Art.10a(1a) 기준이며, EUR-Lex 통합본은 이번 조사에서 직접 조회하지 못함(조회 차단).
    기후중립계획 이행규칙의 관보 번호는 확인하지 못해 C(2023)7298로 표기.
    무상할당 20% 감액 조건(Art.10a(1))은 이번 조사에서 원문 재확인하지 못함.
  last_verified: 2026-10-27

