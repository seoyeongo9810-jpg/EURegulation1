- id: steel_metals_action_plan
  name_ko: 유럽 철강·금속 행동계획
  name_en: European Steel and Metals Action Plan
  status: in_force
  legal_form: Communication
  legal_ref: "COM(2025) 125"
  dg: GROW
  category: [procurement_market, funding_support]
  steel_relevance: high
  effective_date: 2025-03-19
  summary: >
    2025.3.19 Commission이 발표한 철강·금속 산업 행동계획(비입법 통보문). 에너지 비용 완화, 세이프가드 후속 무역조치, CBAM 우회방지,
    산업탈탄소가속화법(현 IAA)을 통한 회복력·지속가능성 기준과 ETS 데이터 기반 자발적 탄소집약도 라벨, ESPR을 통한 철강 함량 높은 제품 요건,
    스크랩 확보(2025년 3분기까지 무역조치 검토, 폐기물 선적규정 활용), 산업탈탄소은행(IDB) 파일럿 경매 등을 제시했다.
    후속으로 2025.7.23 금속 스크랩(철 스크랩 포함) 수출입 세관 감시가 시작되었다. 라벨은 최종 IAA 제안에서 제외된 것으로 보도되었다.
  requirements:
    - type: labelling
      text: ETS 데이터·CBAM 방법론 기반 자발적 탄소집약도 라벨 개발 예고(IAA 최종 제안에서는 제외 보도)
    - type: procurement
      text: 공공조달·공공지원의 회복력·지속가능성 기준 도입 예고(IAA로 구체화)
    - type: trade_measure
      text: 스크랩 가용성 확보를 위한 무역조치 검토, 금속 스크랩 수출입 감시
  scope: "EU 철강·금속 산업 전반(후속 입법·하위법령을 통해 구체화)"
  sub_acts:
    - "산업가속화법 제안 COM(2026) 100"
    - "ESPR 철강 위임법령(준비 중)"
    - "세이프가드 후속 철강 무역조치"
    - "금속 스크랩 수출입 세관 감시(2025.7.23)"
  milestones:
    - date: 2025-03-19
      label: 행동계획 발표
    - date: 2025-07-23
      label: 금속 스크랩 수출입 세관 감시 개시
  consultations: []
  impact:
    eu_producers:
      level: medium
      obligations: 직접 의무 없음(후속 입법으로 구체화)
      opportunities: 에너지·무역·수요 창출 정책 지원
    non_eu_producers:
      level: medium
      obligations: 직접 의무 없음
      costs: 후속 무역조치·조달 요건에 따른 간접 영향
      preparation: 후속 입법(IAA, ESPR 철강, 무역조치) 모니터링
    korea_note: >
      행동계획 자체는 구속력이 없으나 한국 철강사에 영향을 주는 후속 조치(세이프가드 후속 쿼터·관세, IAA 저탄소 조달, ESPR 철강 요건, CBAM 우회방지)의
      출발점이다. 스크랩 수출 제한 논의는 현재 알루미늄 중심이며 철 스크랩은 감시 단계로 확인된다.
  links:
    commission: "https://single-market-economy.ec.europa.eu/publications/european-steel-and-metals-action-plan_en"
    eurlex: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025DC0125"
  related: [industrial_accelerator_act, espr_steel, steel_trade_measure, cbam, industrial_decarbonisation_bank]
  verify_needed: true
  note: >
    신규 추가 항목. 통보문은 법적 '시행' 개념이 없어 status는 발표 완료 의미로 in_force, effective_date는 발표일로 기재.
    금속 스크랩 감시의 법적 근거(이행규정 번호) 미확인.
  last_verified: 2026-10-27

