  related: [steel_trade_measure]
  verify_needed: true
  note: >
    신규 추가 후보. 초안에서 제외된 국가(이집트·인도·파키스탄 등 보도)는 업계 보도 기준이며 공식 초안 문서는 직접 확인하지 못함.
    채택 일자 미정(HYS 계획 Q4 2026).
  last_verified: 2026-10-27

