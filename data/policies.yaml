- id: hydrogen_ghg_methodology
  name_ko: 저탄소 수소·RFNBO 온실가스 감축 산정 방법론 (위임규정)
  name_en: Low-carbon fuels GHG savings methodology (Delegated Regulation (EU) 2025/2359) and planned RFNBO/LCF methodology merger
  status: in_force
  stage: adopted
  legal_form: Delegated Act
  legal_ref: "Commission Delegated Regulation (EU) 2025/2359"
  dg: ENER
  category: [energy_hydrogen, product_footprint]
  steel_relevance: medium
  effective_date: 2025-12-11
  summary: >
    가스·수소 시장 지침(Directive (EU) 2024/1788)에 따라 저탄소 연료(저탄소 수소 포함)의 온실가스 감축량 산정 방법론을 정한 위임규정.
    화석연료 대비 70% 이상 감축을 '저탄소'로 인정하며 RFNBO 방법론(2023/1185)과 같은 전과정 접근을 따른다.
    2025-07-08 채택, 2025-11-21 관보 게재. Commission은 2026-10-21 RFNBO·저탄소연료 방법론을 하나로 통합하고
    원자력 전력 기준을 추가하는 위임규정 개정을 예고했다(초안 의견수렴 예정).
  requirements:
    - type: carbon_footprint
      text: 저탄소 수소 인정 요건 — 전과정 배출 기준 화석연료 대비 70% 이상 감축(방법론에 따른 산정·인증)
  scope: "EU 시장의 저탄소 수소·연료 생산자 및 수입품(역외 생산 포함)"
  sub_acts:
    - "Commission Delegated Regulation (EU) 2023/1185 — RFNBO 방법론"
    - "RFNBO·저탄소연료 방법론 통합 위임규정(예정) — HYS 19515, 초안 의견수렴 예정"
  milestones:
    - date: 2025-07-08
      label: 위임규정 채택 C(2025)4674
    - date: 2025-11-21
      label: 관보 게재
    - date: 2025-12-11
      label: 발효
    - date: 2026-10-21
      label: 방법론 통합 위임규정 이니셔티브 예고
  consultations: []
  impact:
    eu_producers:
      level: low
      obligations: 저탄소 수소 사용 시 인증 기준 확인
      costs: 인증 비용
      preparation: 수소 DRI용 수소의 RFNBO/저탄소 인증 확보 방안
      opportunities: 원자력 기반 수소 인정 시 조달 선택지 확대
    non_eu_producers:
      level: low
      obligations: EU로 수소를 수출하는 경우에만 인증 기준 충족 필요
      costs: 인증 비용
      preparation: 통합 방법론 초안 공개 시 내용 확인
    korea_note: >
      한국산 철강에는 직접 적용되지 않는다. 다만 한국 기업이 EU향 수소·암모니아 공급을 추진하거나 원자력 기반 수소 활용을 검토한다면
      통합 방법론 초안(원자력 전력 기준 포함)에 주목할 필요가 있다.
  links:
