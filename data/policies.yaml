- id: steel_trade_measure
  name_ko: 철강 과잉설비 대응 무역조치 (세이프가드 대체 규정)
  name_en: Regulation addressing the negative trade-related effects of global overcapacity on the Union steel market
  status: in_force
  stage: adopted
  legal_form: Regulation
  legal_ref: "Regulation (EU) 2026/1384"
  dg: TRADE
  category: [carbon_pricing_trade]
  steel_relevance: high
  effective_date: 2026-07-01
  summary: >
    2026.6.30 만료된 철강 세이프가드(Implementing Reg. 2019/159)를 대체하는 상설 수입 조치. 30개 철강 품목군에
    연간 무관세 쿼터 총 18,345,922톤(2024년 대비 약 47% 축소)을 설정하고 쿼터 초과분에 50% 종가세를 부과한다.
    2026.10.1부터 수입 시 용해·주조(melt and pour) 국가 증빙(Mill Test Certificate)을 요구한다.
    2025.10.7 제안, 2026.6.17 서명, 2026.6.24 관보 게재, 2026.7.1 적용.
  requirements:
    - type: trade_measure
      text: 30개 품목군 국가별·잔여 관세할당(TRQ) 연간 18,345,922톤, 분기별 운영, 쿼터 초과분 50% 종가세
    - type: trade_measure
      text: 2026.10.1부터 수입 시 melt and pour 국가와 heat number가 기재된 Mill Test Certificate 제출(IR 2026/1963)
    - type: trade_measure
      text: 국가별 쿼터 배분은 이행규정(IR 2026/1457)으로 결정, 2027.10.1부터 melt and pour 데이터를 배분에 반영
