- id: industrial_accelerator_act
  name_ko: 산업가속화법 (IAA)
  name_en: Industrial Accelerator Act (IAA)
  status: pending
  stage: proposal
  legal_form: Regulation
  legal_ref: "COM(2026) 100, 2026/0068(COD)"
  dg: GROW
  category: [procurement_market, product_footprint]
  steel_relevance: high
  summary: >
    전략 부문의 산업역량 확충과 탈탄소를 가속하기 위한 규정안(2026.3.4 Commission 제안). 공공조달·공공지원에서 'Made in EU'·저탄소 선호,
    FDI 조건, 산업가속지역, 인허가 간소화를 담는다. 보도에 따르면 철강은 2029.1.1부터 공공조달·공공지원 건축·인프라·교통 프로젝트에서
    철강 사용량의 최소 25%를 저탄소로 하도록 하고, 초안에 있던 철강 EU 원산지 요건과 자발적 탄소집약도 라벨은 최종 제안에서 빠졌다.
    저탄소의 정의·산정 방법(ETS·CBAM 방법론 기반)·성능 등급은 향후 위임법령으로 정한다. 제8조(공공조달)는 EU와 FTA·관세동맹을 맺었거나
    WTO GPA 당사국인 제3국을 Union 원산지로 간주하되, 위임법령으로 배제할 수 있게 한다.
    유럽의회는 ITRE·IMCO·INTA 공동위원회 절차로 2026.9.9 초안 보고서(제3국 자동 동등성 대신 opt-in 방식, 2036년 50% 상향 제안)를 냈고,
    위원회 표결 2026.12.1, 본회의 2026.12.14주가 예정되어 있다. 이사회는 일반접근에 이르지 못했다(2026.9.24 경쟁력이사회 현황 보고).
  requirements:
    - type: procurement
      text: 공공조달·공공지원 건축·인프라·교통 프로젝트 철강의 최소 25% 저탄소(2029.1.1부터, 제안 기준·보도)
    - type: procurement
      text: 공공조달 'Made in EU'·Union 원산지 요건(FTA·GPA 당사국은 원산지 간주, 위임법령으로 배제 가능)
    - type: carbon_footprint
      text: 저탄소 철강 정의·온실가스 집약도 산정(ETS·CBAM 방법론 기반) 및 성능 등급을 위임법령으로 설정
  scope: "공공조달·공공지원 대상 건축·인프라·교통 프로젝트에 사용되는 철강(시장 전반이 아닌 공공 수요), 시멘트·알루미늄 등 전략 소재"
  sub_acts:
    - "저탄소 제품 정의·온실가스 집약도 방법론 위임법령(예정)"
    - "Union 원산지 간주 국가 배제 위임법령(예정)"
    - "Regulation (EU) 2024/3110 (CPR), 2024/1735 (NZIA), 2018/1724 개정"
  milestones:
    - date: 2025-04-15
      label: Call for Evidence 게시
    - date: 2026-03-04
      label: Commission 제안 (COM(2026) 100)
    - date: 2026-04-29
      label: 유럽의회 공동 보고관 지명(ITRE·IMCO·INTA)
    - date: 2026-05-28
