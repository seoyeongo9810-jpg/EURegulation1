      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14505-Industrial-Decarbonisation-Accelerator-Act-speeding-up-decarbonisation_en"
  impact:
    eu_producers:
      level: medium
      obligations: 직접 의무는 공공 발주처에 부과, 생산자는 저탄소 입증 데이터 제공
      preparation: ETS 데이터 기반 저탄소 등급 확보
      opportunities: 공공 저탄소 철강 수요(리드마켓) 창출, 'Made in EU' 선호
    non_eu_producers:
      level: high
      obligations: EU 공공 프로젝트 납품 시 저탄소 입증(CBAM 방법론 기반 예상), 원산지 요건 충족
      preparation: CBAM 검증 배출량 데이터 활용, 원산지 증빙
      opportunities: FTA·GPA 당사국은 원산지 간주로 접근 가능(제안 기준), 저탄소 제품은 25% 할당 수요 확보
    korea_note: >
      한국은 EU와 FTA를 체결했고 WTO GPA 당사국이므로 Commission 제안 제8조상 공공조달에서 Union 원산지로 간주될 수 있다. 다만 유럽의회 초안은
      FTA·GPA에 따른 자동 동등성을 부정하고 opt-in(위임법령으로 국가별 인정) 방식을 제안하고 있어 최종 협상 결과에 따라 접근성이 크게 달라질 수 있다.
      저탄소 판정이 ETS·CBAM 방법론에 기반할 예정이므로 CBAM용 설비 단위 검증 데이터가 그대로 경쟁력 자료가 된다. 공공지원 제도(제9조)는 GPA 기준이
      빠져 FTA 기준만 적용되는 점도 확인이 필요하다.
