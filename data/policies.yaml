- id: cbam_export
  name_ko: CBAM 수출 탄소유출 대응 — 임시 탈탄소 기금(TDF)
  name_en: Temporary Decarbonisation Fund (CBAM export-related carbon leakage)
  status: pending
  stage: proposal
  legal_form: Regulation
  legal_ref: "COM(2025) 990 / 2025/0418(COD)"
  dg: TAXUD
  category: [carbon_pricing_trade, funding_support]
  steel_relevance: medium
  summary: >
    CBAM 대상 제품(철강·알루미늄·비료 등)을 생산·수출하는 EU 생산자의 잔여 탄소누출 위험에 대응해
    ETS 탄소비용 일부를 한시 지원하는 기금 신설 규정안. 2025.12.17 Commission 제안(CBAM 하류 확대안과 함께),
    재원은 회원국의 2026·2027년 CBAM 관련 수입 일부. 유럽의회는 2026.9.15 1독 입장을 채택했으나 이사회 입장은 아직 없다.
  requirements:
    - type: trade_measure
      text: EU 역내 CBAM 대상 제품 생산·수출자의 탄소비용 일부 보전(Commission안 2028~2029년 지원, 의회안 2027~2029년)
    - type: mrv
      text: 지원 조건으로 탈탄소 노력 입증(의회는 기후중립 계획 등 조건 강화 요구)
  scope: "EU 역내 CBAM 대상 제품 생산 설비 운영자 및 (의회안) 해당 제품을 주원료로 쓰는 하류 운영자"
  milestones:
    - date: 2025-12-17
      label: Commission 제안 COM(2025) 990
    - date: 2026-07-06
      label: 유럽의회 ENVI 위원회 표결
    - date: 2026-09-15
      label: 유럽의회 본회의 1독 입장 채택, 협상 위해 위원회 회부
  consultations: []
  impact:
    eu_producers:
      level: medium
      obligations: 지원 신청 시 탈탄소 조건 충족
      opportunities: 역외 수출 시 탄소비용 부담 일부 보전으로 수출 경쟁력 유지
    non_eu_producers:
      level: low
      obligations: 직접 의무 없음
      costs: 제3국 시장에서 EU 철강과의 경쟁 조건 변화(간접 영향)
    korea_note: >
      한국 철강사에 직접 의무는 없지만, EU 철강사의 역외 수출 비용이 보전되면 제3국 시장에서 EU산과의 경쟁 조건이 달라질 수 있다.
      기금은 한시 조치이며 근본적 수출 해법은 ETS 검토 등 후속 논의로 넘어가 있으므로 ETS 무상할당·수출 조정 논의와 함께 모니터링하면 된다.
  links:
    commission: "https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-legislation-and-guidance_en"
    eurlex: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025PC0990"
    oeil: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025/0418(COD)"
  related: [cbam, cbam_downstream, ets_review]
  verify_needed: true
  note: >
    seed의 '수출 관련 조치'를 실제 제안인 임시 탈탄소 기금(TDF)으로 재정의함. 2025.12 패키지에 별도 '수출 조정' 법안은 확인되지 않음.
    이사회 입장·트릴로그 일정 미확인. TDF 전용 Have Your Say 페이지는 찾지 못함. EUR-Lex CELEX 52025PC0990 링크는 번호 체계로 구성(직접 열람 못 함).
