- id: red3
  name_ko: 재생에너지지침 개정 (RED III)
  name_en: Renewable Energy Directive (RED III)
  status: in_force
  stage: adopted
  legal_form: Directive
  legal_ref: "Directive (EU) 2023/2413 (Directive (EU) 2018/2001 개정)"
  dg: ENER
  category: [energy_hydrogen]
  steel_relevance: low
  effective_date: 2023-11-20
  summary: >
    2030년 재생에너지 비중 목표를 최소 42.5%(목표 45%)로 상향한 지침 개정. 산업 부문 수소 사용 중 재생 수소(RFNBO) 비중
    구속력 목표(제22a조)를 도입해 수소환원제철 연료 조달에 영향을 준다. 2023-11-20 발효, 대부분 조항의 전환 기한은 발효 후 18개월이다.
    Commission은 2030년 이후 재생에너지 법체계 제안을 2026년 말 발표 예정이다(renewables_post2030 참고).
  requirements:
    - type: product_info
      text: "산업용 수소 중 RFNBO 비중 목표(제22a조, 회원국 단위) — RFNBO는 위임규정 (EU) 2023/1184·2023/1185 기준 충족 필요"
    - type: carbon_footprint
      text: "RFNBO 온실가스 감축 70% 이상(위임규정 (EU) 2023/1185 방법론)"
  scope: "회원국 산업 부문 수소 사용(철강 수소 DRI 포함), 재생에너지 전반"
  sub_acts:
