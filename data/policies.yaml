    Commission이 2026-07-17 제안한 ETS 지침 개정안. 2040년 -90% 목표에 맞춘 2031~2040 상한·선형감축률,
    무상할당·탄소누출 보호의 2040년까지 연장, 2031년부터 모든 무상할당을 'Invest in EU 탈탄소계획'에 연동(80%는 계획 승인 시,
    20%는 감축 실적 확인 후 지급), CBAM 부문 무상할당 폐지 일정 완화(2028년부터 폐지분의 15% 재도입, 완전 폐지 2034→2038년),
    산업탈탄소은행(Industrial Decarbonisation Bank, 2028년~) 신설 등을 담았다. 의회 ENVI 위원회 검토 단계이며,
    Council은 2026-10-12 환경이사회에서 정책토론을 진행했다.
  requirements:
