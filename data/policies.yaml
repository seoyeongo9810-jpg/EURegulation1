# - https://single-market-economy.ec.europa.eu/document/download/cad28304-4b49-4396-81a8-6a816d8f1a93_en (COM(2025) 772 CPR 작업계획 2026-2029: OJ 2024.12.18, 철강 제품군, ETS 데이터 위임법령, 녹색조달 영향평가 2026년 말)
# - https://ec.europa.eu/info/law/better-regulation/brpapi/groupInitiatives/14933 (AVS 위임규정 초안 피드백 2025-12-10~2026-01-07, C(2026)3835)
