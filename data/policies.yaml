      costs: 2031년 이후 ETS 상한 경로를 통해 탄소비용 수준에 영향
      preparation: 2040년 감축경로를 반영한 장기 투자계획 수립
      opportunities: 영구 탄소제거·국제크레딧 활용 등 유연성 확대
    non_eu_producers:
      level: low
      obligations: 직접 의무 없음
      costs: ETS·CBAM 후속 개정을 통한 간접 영향
      preparation: 후속 ETS·CBAM 개정 일정 추적
    korea_note: >
      2040년 -90% 목표가 법제화되면서 2031년 이후 EU ETS 상한 축소와 CBAM 유지가 사실상 확정된 방향이 됐다.
      한국 철강사는 2030년 이후에도 EU 수출품에 탄소비용이 부과된다는 전제로 장기 저탄소 전환·내재배출량 관리 계획을 세울 필요가 있다.
      국제크레딧(파리협정 제6조) 활용 규정이 마련되면 한-EU 간 크레딧 협력 논의 여지도 있다.
  links:
    commission: "https://climate.ec.europa.eu/areas-action/european-climate-law_en"
    eurlex: "https://eur-lex.europa.eu/eli/reg/2026/667/oj"
    have_your_say: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14397-European-Climate-Law-amendment_en"
    oeil: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025/0524(COD)"
    guidance: "https://climate.ec.europa.eu/areas-action/climate-strategies-targets/2040-climate-target_en"
  related: [ets_review, eu_ets, cbam]
  verify_needed: true
  note: >
    채택·발효 확인(Commission 페이지: 'Regulation (EU) 2026/667', '2026년 4월 발효'). 관보 게재일 2026-03-18은 법률사무소 등 복수 출처,
    발효일 2026-04-07은 '게재 후 20일' 규정으로 계산한 값으로, EUR-Lex 원문은 조회 차단으로 직접 확인하지 못함.
    국제크레딧·회원국 목표 후속 Regulation 제안은 HYS상 'UPCOMING'으로 제안일 미정.
  last_verified: 2026-10-27

