  consultations:
    - type: call_for_evidence
      title: "Legislative proposal for a Regulation of the European Parliament and of the Council on the Industrial Decarbonisation Accelerator Act"
      start: 2025-04-15
      end: 2025-07-08
      summary: 산업탈탄소가속화법(당시 명칭) 영향평가 Call for Evidence.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14505-Industrial-Decarbonisation-Accelerator-Act-speeding-up-decarbonisation_en"
    - type: public_consultation
      title: "IDAA Public Consultation"
      start: 2025-04-16
      end: 2025-07-09
      summary: 저탄소 제품 라벨·공공조달 기준 등에 대한 공개 설문.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14505-Industrial-Decarbonisation-Accelerator-Act-speeding-up-decarbonisation_en"
    - type: draft_act_feedback
      title: "Proposal for a REGULATION OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL establishing a framework of measures for the acceleration of industrial capacity and decarbonisation in strategic sectors (COM(2026)100)"
      start: 2026-03-11
      end: 2026-06-18
