- id: nzia
  name_ko: 넷제로산업법 (NZIA)
  name_en: Net-Zero Industry Act (NZIA)
  status: in_force
  legal_form: Regulation
  legal_ref: "Regulation (EU) 2024/1735"
  dg: GROW
  category: [procurement_market]
  steel_relevance: low
  effective_date: 2024-06-29
  summary: >
    넷제로 기술 역내 제조 역량 강화를 위한 규정. 공공조달(제25조)·재생에너지 경매(제26조)에 지속가능성·회복력 등 비가격 기준을 도입한다.
    하위법령으로 재생에너지 경매 비가격 기준 이행규정(EU) 2025/1176, 넷제로 기술 제품·부품 목록 이행규정(EU) 2025/1178,
    공공조달 최소 환경지속가능성 요건 이행규정(EU) 2026/718(현재 풍력 블레이드 재활용 요건 중심) 등이 채택되었다.
    철강을 직접 규율하는 조항은 없으나, 산업가속화법(IAA)과 공공조달법 제안이 NZIA를 개정하는 안을 담고 있다.
  requirements:
    - type: procurement
      text: 넷제로 기술 공공조달 시 최소 환경지속가능성 요건(IR 2026/718) 및 회복력 등 추가 기준 적용
    - type: procurement
      text: 재생에너지 경매 물량의 30% 이상 또는 연 6GW 이상에 비가격 기준 적용(IR 2025/1176)
  scope: "넷제로 기술(풍력·태양광·배터리·전해조 등) 공공조달 및 재생에너지 경매. 철강은 부품 소재로 간접 관련"
  sub_acts:
    - "Implementing Regulation (EU) 2025/1176 (재생에너지 경매 비가격 기준)"
    - "Implementing Regulation (EU) 2025/1178 (넷제로 기술 최종제품·주요 부품 목록)"
    - "Implementing Regulation (EU) 2026/718 (공공조달 최소 환경지속가능성 요건)"
    - "Delegated Regulation (EU) 2025/1463 (주요 사용 부품)"
    - "Implementing Decision (EU) 2025/1100 (전략 프로젝트 신청 지침)"
  milestones:
    - date: 2024-06-28
      label: 관보 게재
    - date: 2024-06-29
      label: 발효
    - date: 2025-12-30
      label: 경매 비가격 기준(제26조) 적용 개시
    - date: 2026-06-30
      label: 공공조달 최소 환경지속가능성 요건(IR 2026/718) 적용 개시
  consultations:
    - type: draft_act_feedback
      title: "COMMISSION IMPLEMENTING REGULATION (EU) …/... laying down rules for the application of Regulation (EU) 2024/1735 of the European Parliament and of the Council as regards minimum environmental sustainability requirements"
      start: 2025-09-16
      end: 2025-10-14
      summary: NZIA 공공조달 최소 환경지속가능성 요건 이행규정 초안(이후 IR 2026/718로 채택).
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14467-Minimum-requirements-on-environmental-sustainability-for-NZIA-public-procurement-procedures_en"
  impact:
    eu_producers:
      level: low
      obligations: 직접 의무 없음
      opportunities: 넷제로 기술 공급망 수요 확대에 따른 소재 수요
    non_eu_producers:
      level: low
      obligations: 직접 의무 없음, 넷제로 기술 조달·경매에서 회복력 기준에 따른 간접 영향
      opportunities: 풍력 타워·구조재 등 부품 소재 공급
    korea_note: >
      철강 자체에 대한 직접 의무는 없다. 풍력 타워·후판 등 넷제로 기술 부품 소재를 공급하는 경우 EU 발주처의 회복력·지속가능성 기준 적용 여부를
      확인할 필요가 있다. 철강의 저탄소 공공조달 요건은 NZIA가 아니라 IAA 제안에서 다뤄진다.
  links:
    commission: "https://single-market-economy.ec.europa.eu/industry/sustainability/net-zero-industry-act_en"
    eurlex: "https://eur-lex.europa.eu/eli/reg/2024/1735/oj"
    have_your_say: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14467-Minimum-requirements-on-environmental-sustainability-for-NZIA-public-procurement-procedures_en"
  related: [industrial_accelerator_act, public_procurement_act]
  verify_needed: true
  note: >
    제26조 적용일(2025-12-30)은 법률사무소 자료, IR 2026/718 적용일(2026-06-30)은 Commission 통보문 기반(EUR-Lex 원문 접속 불가).
    제25조 공공조달 조항의 정확한 적용 개시일 미확인.
  last_verified: 2026-10-27

