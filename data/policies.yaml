- id: cbam
  name_ko: 탄소국경조정제도
  name_en: Carbon Border Adjustment Mechanism (CBAM)
  status: in_force
  legal_form: Regulation
  legal_ref: "Regulation (EU) 2023/956 (Regulation (EU) 2025/2083으로 개정)"
  dg: TAXUD
  category: [carbon_pricing_trade]
  steel_relevance: high
  effective_date: 2023-10-01
  summary: >
    EU로 수입되는 철강 등 탄소집약 제품의 내재배출량에 EU ETS 수준의 탄소가격을 부과하는 제도.
    2023.10~2025.12 전환기간(분기 보고)을 거쳐 2026.1.1 확정기간이 시작되었다.
    간소화 개정(Reg. (EU) 2025/2083, 2025.10.8 채택)으로 연간 50톤 미만(수소·전력 제외) 수입자는 면제되며,
    인증서 판매는 2027.2.1 공동중앙플랫폼(CCP)에서 시작되고 2026년분 첫 신고·제출 기한은 2027.9.30이다.
  requirements:
    - type: carbon_footprint
      text: 설비 단위 내재배출량 산정. 철강은 직접배출만 대상(간접배출은 시멘트·비료·소결광에 한정)
    - type: mrv
      text: 실측값 사용 시 인정받은 CBAM 검증기관의 검증 필요. 실측값이 없으면 기본값(Reg. 2025/2621, mark-up 2026년 10%·2027년 20%·2028년부터 30%) 적용
    - type: certificate
      text: 2027.2.1부터 CCP에서 인증서 구매. 2026년분 연간 신고·인증서 제출 2027.9.30까지, 2027년부터 분기말마다 연초 이후 수입분 내재배출량의 50% 이상 보유
    - type: certificate
      text: 원산지에서 실제 납부한 탄소가격만큼 제출 인증서 수 감축 가능(세부 이행법령 제정 중), ETS 무상할당 조정분 차감
    - type: trade_measure
      text: 연간 50톤(단일 질량 기준) 초과 수입 시 허가 신고인(Authorised CBAM declarant) 지위 필요
  scope: "CBAM 부속서 I의 철강 품목(CN 2601 12 00 소결광, 72류 대부분, 7301~7311, 7318, 7326 등), 연간 누적 50톤 초과 수입자"
  sub_acts:
    - "Regulation (EU) 2025/2083 (간소화 개정, 2025.10.8 채택)"
    - "Implementing Regulation (EU) 2025/2547 (내재배출량 산정방법)"
    - "Implementing Regulation (EU) 2025/2546 (검증 원칙), Delegated Regulation (EU) 2025/2551 (인정·검증)"
    - "Implementing Regulation (EU) 2025/2548 (인증서 가격 산정·공표)"
    - "Implementing Regulation (EU) 2025/2620 (무상할당 조정·CBAM 벤치마크)"
    - "Implementing Regulation (EU) 2025/2621 (기본값), 2026/1740 (기본값 정정)"
    - "Implementing Regulation (EU) 2025/486·2025/2549 (허가 신고인), 2024/3210·2025/2550 (CBAM 등록부)"
    - "Implementing Regulation (EU) 2025/2619 (세관 정보 전달), 2025/2210 (대륙붕·EEZ 반입 물품)"
  milestones:
    - date: 2023-10-01
      label: 전환기간 시작(보고 의무)
    - date: 2025-10-20
      label: 간소화 개정 Reg. (EU) 2025/2083 발효
    - date: 2026-01-01
      label: 확정기간 시작(허가 신고인만 수입, 2026년 수입분부터 재정 의무)
    - date: 2026-08-14
      label: 확정기간 가이던스(철강 Guidance 5d 포함) 공표
    - date: 2027-02-01
      label: 공동중앙플랫폼(CCP) 가동, CBAM 인증서 판매 개시
    - date: 2027-09-30
      label: 2026년분 첫 연간 CBAM 신고 및 인증서 제출 마감
    - date: 2028-01-01
      label: 기본값 mark-up 30% 적용 시작
  consultations: []
  impact:
    eu_producers:
      level: medium
      obligations: 직접 의무 없음 (EU ETS 무상할당 단계적 축소와 연동)
      costs: 무상할당 축소에 따른 탄소비용 증가
      opportunities: 수입재와의 탄소비용 격차 해소
    non_eu_producers:
      level: high
      obligations: EU 수입자(허가 신고인)에게 설비 단위 내재배출량 데이터와 검증보고서 제공, CBAM 등록부에 운영자로 등록 가능
      costs: 수입자가 부담하는 인증서 비용이 수출 가격 협상에 반영. 기본값 사용 시 mark-up(2026 10%→2028 30%)으로 부담 증가
      preparation: 설비별 배출량 모니터링·산정 체계, 인정받은 CBAM 검증기관 확보(첫 인정 2026.9경, 검증은 2027년 초), 원산지 탄소가격 납부 증빙
      opportunities: 실측 배출량이 기본값보다 낮으면 가격 경쟁력 확보, 저탄소 제품 차별화
    korea_note: >
      포스코·현대제철 등의 대EU 수출 주력품목(열연·냉연·도금강판·스테인리스·강관 등)은 모두 CBAM 대상이다.
      2026년 수출분은 2027.9.30 첫 신고 시 실측값을 쓰려면 2027년 초까지 인정받은 검증기관의 검증을 마쳐야 하므로,
      설비별 2026년 배출 데이터 정리와 검증기관 계약을 서둘러야 한다. 철강은 간접배출이 제외되므로 직접배출 산정 정확도가 핵심이다.
      K-ETS 납부 탄소가격 공제는 별도 이행법령(초안 피드백 2026.6 마감)이 확정되어야 하므로 무상할당분 차감 방식과 증빙 요건을 주시해야 한다.
      한국산 기본값(2025/2621, 2026/1740 정정)과 실측값을 비교해 고객사(EU 수입자)에게 유리한 데이터를 제공할 준비가 필요하다.
  links:
    commission: "https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism_en"
    eurlex: "https://eur-lex.europa.eu/eli/reg/2023/956/oj"
    guidance: "https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-legislation-and-guidance_en"
  related: [eu_ets, cbam_downstream, cbam_export, cbam_secondary_acts]
  verify_needed: false
  note: >
    seed 대비 수정: 철강은 간접배출 제외(Q&A 4.20). 2025/2083 관보일(2025.10.17)·발효일(2025.10.20)은 보조 출처 기준이며 EUR-Lex 직접 열람은 못 함.
    CN 범위는 Reg. 2023/956 부속서 I 기준 요약으로 EUR-Lex 원문 재대조 권장.
  last_verified: 2026-10-27

