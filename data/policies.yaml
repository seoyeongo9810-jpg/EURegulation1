- id: circular_economy_act
  name_ko: 순환경제법
  name_en: Circular Economy Act
  status: pending
  stage: consultation
  legal_form: Regulation
  dg: ENV
  category: [product_footprint, procurement_market]
  steel_relevance: medium
  summary: >
    2차 원료 단일시장 조성, 고품질 재활용 원료 공급·수요 확대를 목표로 하는 입법 예정안. 2025.8.1~11.6 Call for Evidence·공개협의를 마쳤고,
    Have Your Say상 채택 계획은 2026년 4분기다. 보도에 따르면 규제심사위원회 지적으로 지연되어 2026.11.11 제안이 예정되어 있으며,
    EPR 조화, 폐기물 분류·정의 조화, 순환자원 순환 원활화(국경 간 이동 간소화), 폐기물 종료 기준 개정, WEEE 개정 등을 담을 것으로 알려졌다.
    철강·금속 행동계획은 이 법으로 금속 스크랩 단일시장과 분류 개선을 추진하겠다고 밝혔다.
  requirements:
    - type: product_info
      text: 2차 원료(스크랩 포함) 폐기물 분류·폐기물 종료 기준 조화, 재활용 원료 수요 촉진(제안 전)
  scope: "2차 원료 시장 전반(금속 스크랩 포함), 구체적 범위는 제안 공개 후 확인"
  milestones:
    - date: 2025-08-01
      label: Call for Evidence·공개협의 개시
    - date: 2025-11-06
      label: Call for Evidence·공개협의 마감
  consultations:
    - type: call_for_evidence
      title: "Circular Economy Act"
      start: 2025-08-01
      end: 2025-11-06
      summary: 순환경제법 영향평가 Call for Evidence(Ares(2025)6250342).
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14812-Circular-Economy-Act_en"
    - type: public_consultation
      title: "PUBLIC CONSULTATION QUESTIONNAIRE Circular Economy Act"
      start: 2025-08-01
      end: 2025-11-06
      summary: 2차 원료 공급·수요, 순환 비즈니스 장벽 등에 대한 공개 설문.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14812-Circular-Economy-Act_en"
  impact:
    eu_producers:
      level: medium
      opportunities: 역내 스크랩 확보·유통 원활화
      preparation: 스크랩 품질·분류 체계 대응
    non_eu_producers:
      level: low
      obligations: 직접 의무는 제안 공개 전 불명
      costs: 스크랩 역외 유출 억제 조치 포함 시 국제 스크랩 수급에 간접 영향
    korea_note: >
      제안이 공개되지 않아 직접 영향은 불명이다. 전기로 확대를 추진하는 한국 철강사는 EU 스크랩 수출 억제·재활용 함량 요건 등 스크랩 수급에 영향을 줄
      조항이 포함되는지 2026.11 제안 공개 시 확인할 필요가 있다.
  links:
    commission: "https://environment.ec.europa.eu/news/commission-launches-consultation-upcoming-circular-economy-act-2025-08-01_en"
    have_your_say: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14812-Circular-Economy-Act_en"
  related: [elv_regulation, espr, steel_metals_action_plan]
  verify_needed: true
  note: >
    신규 추가 항목. 제안 예정일(2026.11.11)은 업계 언론 보도로 미확정. 법적 형식(Regulation)은 예상이며 미확인. 스크랩 관련 조항 포함 여부 미확인.
  last_verified: 2026-10-27

