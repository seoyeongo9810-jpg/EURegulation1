- id: public_procurement_act
  name_ko: 공공조달법 (공공조달지침 개정)
  name_en: Public Procurement Act
  status: pending
  stage: proposal
  legal_form: Regulation
  legal_ref: "COM(2026) 590, 2026/0265(COD)"
  dg: GROW
  category: [procurement_market]
  steel_relevance: medium
  summary: >
    2014년 공공조달 3개 지침을 단일 규정으로 대체하는 제안(2026.9.9). 공공 발주처가 유럽 선호 요건(참여 제한, 최소 Union·대상국 원산지,
    평가 가점)을 적용할 수 있는 수평적 틀을 만들고, GPA 당사국·EU와 무역협정을 맺은 국가의 사업자는 협정 조건에 따라 동등 대우한다.
    제54조는 ESPR·CPR 등 부속서 VII 법령의 성능 등급·임계값을 조달 요건으로 사용하도록 하고, Commission이 위임법령으로 저탄소 제품 수요 확보 등을 위한
    의무 환경 요건을 정할 수 있게 한다. ESPR·CPR·NZIA의 조달 조항을 이관·개정한다. 발효 후 2년 뒤 적용(제안 기준).
    제안 피드백이 2026.12.22까지 진행 중이다.
  requirements:
    - type: procurement
      text: ESPR·CPR 등 성능 등급·임계값을 조달 사양·평가 기준에 반영, 위임법령으로 의무 환경 요건 설정 가능(제54조)
    - type: procurement
      text: 유럽 선호 요건(참여 제한·최소 원산지·가점) 적용 틀, GPA·FTA 대상국 사업자 동등 대우
    - type: product_info
      text: 원산지 요건 적용 시 입찰 물품 원산지 표시(해당 시 ESPR 디지털 제품여권 반영)
  scope: "EU 공공계약·양허계약 전반(건설·인프라 사업의 철강 조달 포함)"
  sub_acts:
    - "제54조 녹색조달 의무 환경 요건 위임법령(예정)"
  milestones:
    - date: 2025-11-03
      label: Call for Evidence·공개협의 개시
    - date: 2026-09-09
      label: Commission 제안 (COM(2026) 590)
    - date: 2026-12-22
      label: 제안 피드백 마감
  consultations:
    - type: call_for_evidence
      title: "Commission Proposal for a Public Procurement Act"
      start: 2025-11-03
      end: 2026-01-26
      summary: 공공조달지침 개정 영향평가 Call for Evidence(Ares(2025)9425851).
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15492-Revision-of-EU-rules-on-public-procurement_en"
    - type: public_consultation
      title: "Public Procurement Directives - revision"
      start: 2025-11-03
      end: 2026-01-26
      summary: 공공조달지침 개정 공개 설문.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15492-Revision-of-EU-rules-on-public-procurement_en"
    - type: draft_act_feedback
      title: "Proposal for a REGULATION OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL on public contracts and concessions, repealing Directives 2014/23/EU, 2014/24/EU and 2014/25/EU (COM(2026)590)"
      start: 2026-09-15
      end: 2026-12-22
      summary: Commission 제안에 대한 피드백(진행 중). 유럽 선호·녹색조달 조항에 의견 제출 가능.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15492-Revision-of-EU-rules-on-public-procurement_en"
  impact:
    eu_producers:
      level: medium
      obligations: 직접 의무는 공공 발주처에 부과
      opportunities: 유럽 선호·녹색조달 확대에 따른 공공 수요
    non_eu_producers:
      level: medium
      obligations: 유럽 선호 적용 시 원산지 증빙, 녹색조달 요건 충족
      preparation: 원산지·제품 환경 데이터(DPP·EPD) 준비
      opportunities: GPA·FTA 대상국은 동등 대우
    korea_note: >
      한국은 GPA 당사국이자 EU FTA 체결국으로 제안상 동등 대우 대상이나, 대우 범위는 협정의 양허 범위에 따른다. 철강의 구체적 저탄소 조달 할당은 IAA가,
      일반 녹색조달 요건은 이 법(제54조)이 맡는 구조이므로 두 법안을 함께 모니터링해야 한다. 제안 피드백이 2026.12.22까지 열려 있다.
  links:
    commission: "https://single-market-economy.ec.europa.eu/document/download/59557310-3af0-426d-b6b6-0357b650065f_en"
    have_your_say: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15492-Revision-of-EU-rules-on-public-procurement_en"
    oeil: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2026/0265(COD)"
  related: [industrial_accelerator_act, espr, cpr, nzia]
  verify_needed: true
  note: >
    신규 추가 항목. commission 링크는 제안서 PDF(GROW 사이트)로 별도 정책 페이지 미확인. 유럽의회 소관 위원회 미배정.
    철강 관련성은 수평적 조달 규칙 차원(중간)으로 판단.
  last_verified: 2026-10-27

