- id: cbam_downstream
  name_ko: CBAM 적용범위 확대 (하류제품·우회방지)
  name_en: CBAM extension to downstream goods and anti-circumvention measures
  status: pending
  stage: trilogue
  legal_form: Regulation
  legal_ref: "COM(2025) 989 / 2025/0419(COD)"
  dg: TAXUD
  category: [carbon_pricing_trade]
  steel_relevance: high
  summary: >
    철강·알루미늄 집약 하류제품(Commission안 약 180개 품목)을 CBAM 대상에 추가하고 우회방지 조항을 도입하는 개정안.
    2025.12.17 Commission 제안, 2026.6.12 이사회 일반접근(약 200개 품목 추가), 2026.9.15 유럽의회 1독 입장 채택 후
    3자 협상(트릴로그)이 진행 중이다. Commission안 적용 목표는 2028.1.1.
  requirements:
    - type: carbon_footprint
      text: 철강·알루미늄 집약 하류제품까지 내재배출량 신고·인증서 의무 확대(대상 품목 수는 협상 중)
    - type: trade_measure
      text: 우회방지 조항(우회 정의, 자원 셔플링, 공급망 인위 조정 대응, 신뢰성 낮은 경우 국가 기본값 적용 등)
    - type: carbon_footprint
      text: 소비 전(pre-consumer) 철강 스크랩을 전구물질로 취급하는 방안(기관별 입장 상이)
  scope: "철강·알루미늄 집약 하류제품: Commission 약 180개, 이사회 약 200개 추가, 의회(ENVI) 457개 품목 — 최종 범위 미정"
  milestones:
    - date: 2025-08-26
      label: Call for Evidence·공개협의 마감
    - date: 2025-12-17
      label: Commission 제안 COM(2025) 989
    - date: 2026-06-12
      label: 이사회(ECOFIN) 일반접근 합의
    - date: 2026-07-06
      label: 유럽의회 ENVI 위원회 표결
    - date: 2026-09-15
      label: 유럽의회 본회의 1독 입장 채택, 트릴로그 개시
    - date: 2026-10-20
      label: 첫 정치적 트릴로그(보조 출처 기준)
    - date: 2026-11-30
      label: 두 번째 트릴로그 잠정 예정(보조 출처 기준)
    - date: 2028-01-01
      label: 하류제품 적용 목표(Commission안)
  consultations:
    - type: call_for_evidence
      title: "Extension of the scope of the carbon border adjustment mechanism to downstream products and anti-circumvention measures"
      start: 2025-07-01
      end: 2025-08-26
      summary: 하류제품 CBAM 확대와 우회방지 조치의 필요성·설계 방향에 대한 의견 수렴(영향평가용 Call for Evidence, 352건 접수)
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14748_en"
    - type: public_consultation
      title: "Extension of the scope of the carbon border adjustment mechanism to downstream products and anti-circumvention measures"
      start: 2025-07-01
      end: 2025-08-26
      summary: 하류제품 대상 선정 기준, 탄소누출 위험, 우회 행태와 대응 수단에 대한 공개 설문(371건 접수)
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14748_en"
  impact:
    eu_producers:
      level: medium
      obligations: 역내 하류제품 생산자에 직접 의무 없음
      opportunities: 하류제품 수입재와의 탄소비용 격차 해소, 상류 CBAM 회피형 우회수입 차단
    non_eu_producers:
      level: high
      obligations: 하류제품 수출 시에도 수입자에게 내재배출량 데이터(전구물질 강재 포함) 제공
      costs: 하류제품 단위 인증서 비용 발생 및 공급망 배출 데이터 관리 부담
      preparation: 하류제품에 투입된 강재의 원산지·설비별 배출량 추적 체계
      opportunities: 실측 저탄소 강재를 쓰는 하류제품의 차별화
    korea_note: >
      확정 시 한국산 강재를 원료로 한 자동차부품·기계·전기기기 등 하류제품 수출에도 CBAM 비용이 붙는다.
      의회안(457개)은 Commission안(약 180개)보다 범위가 훨씬 넓어 최종 품목 목록이 핵심 변수다.
      철강사는 하류 고객사(부품·가전·건설자재 업체)에 강재 배출량 데이터를 제공할 수 있도록 제품·로트 단위 데이터 체계를 준비하고,
      트릴로그 결과(2026년 말 합의 목표)와 최종 CN 목록을 확인해 영향 품목을 선별해야 한다.
