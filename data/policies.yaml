# - https://ec.europa.eu/info/law/better-regulation/brpapi/groupInitiatives/14467 (공공조달 최소요건 이행규정 초안 피드백 2025-09-16~2025-10-14)
# - https://www.globalpolicywatch.com/2025/08/adoption-of-implementing-act-on-non-price-criteria-in-renewable-energy-auctions/ (제26조 적용 2025-12-30, 2차 출처)
# - https://energy.ec.europa.eu/document/download/d8cb7c28-2d96-4b4d-8f1c-15eb8189f506_en (C(2026) 5024: IR 2026/718 풍력 블레이드 재활용, 적용 2026-06-30)
