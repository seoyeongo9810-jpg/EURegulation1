- id: ets_benchmarks_2026_2030
  name_ko: EU ETS 무상할당 벤치마크 갱신 (2026~2030)
  name_en: EU ETS benchmark values for free allocation 2026-2030
  status: in_force
  stage: adopted
  legal_form: Implementing Act
  legal_ref: "Commission Implementing Regulation (EU) 2026/1412"
  dg: CLIMA
  category: [carbon_pricing_trade]
  steel_relevance: high
  effective_date: 2026-06-30
  summary: >
    2026~2030 ETS 무상할당 산정에 쓰이는 54개 벤치마크(제품 52, 열·연료 fallback 2)를 2021~2022년 상위 10% 설비 성과로 갱신한
    이행규칙(2026-06-26 채택, 2026-06-29 관보, 다음 날 발효). 철강 벤치마크가 대부분 하향됐다(고로 용선 1.248, 코크스 0.143,
    소결광 0.086, 전기로 탄소강 0.142, 전기로 고합금강 0.176 배출권/t). 수소 직접환원 철강은 hot metal 벤치마크 평균 산정에서 제외됐다.
    후속으로 열·연료 fallback 벤치마크 상향 Regulation 제안(COM(2026) 619)이 의회에서 긴급절차로 처리 중이다.
  requirements:
    - type: bat_limits
      text: "철강 제품 벤치마크(배출권/t): 고로 용선 1.248, 코크스 0.143, 소결광 0.086, 전기로 탄소강 0.142, 전기로 고합금강 0.176"
    - type: certificate
      text: 벤치마크 × 활동량 × CBAM factor로 설비별 무상할당 결정 → CBAM 인증서 조정에도 반영 예정
  scope: "EU ETS 무상할당 대상 설비(철강 포함). CBAM 무상할당 조정 기준값과 연계"
  sub_acts:
    - "COM(2026) 619 / 2026/0211(COD) — 2026~2030 열·연료 fallback 벤치마크 상향 Regulation 제안"
    - "CBAM 인증서 조정용 벤치마크 정렬 이행규칙(예정) — HYS 16933(TAXUD), 초안 의견수렴 예정"
  milestones:
    - date: 2026-06-26
      label: Implementing Regulation (EU) 2026/1412 채택
    - date: 2026-06-29
      label: 관보 게재
    - date: 2026-06-30
      label: 발효
    - date: 2026-07-17
      label: fallback 벤치마크 상향 Regulation 제안 COM(2026) 619
    - date: 2026-10-19
      label: 유럽의회 ENVI 위원회 표결(COM(2026) 619)
    - date: 2026-10-22
      label: 유럽의회 본회의 — 3자협상 위해 위원회 회부(COM(2026) 619)
  consultations:
    - type: draft_act_feedback
      title: "COMMISSION IMPLEMENTING REGULATION (EU) …/... determining revised benchmark values for free allocation of emission allowances for the period from 2026 to 2030 pursuant to Article 10a(2) of Directive 2003/87/EC"
      start: 2026-05-11
      end: 2026-06-08
      summary: 벤치마크 값 초안 의견수렴(442건). fallback 벤치마크 하향·업종별 fallback 요구 의견 다수
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/15873-Revision-of-the-benchmark-values-for-free-allocation-of-emission-allowances-2026-2030-_en"
    - type: draft_act_feedback
      title: "Proposal for a REGULATION OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL amending Directive 2003/87/EC as regards revised benchmark values for the heat and fuel benchmarks for the period from 2026 to 2030"
      start: 2026-08-20
      end: 2026-11-03
      summary: fallback(열·연료) 벤치마크 상향 Regulation 제안 COM(2026) 619 피드백(진행 중)
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14549-EU-emissions-trading-system-for-maritime-aviation-and-stationary-installations-and-market-stability-reserve-review_en"
  impact:
    eu_producers:
      level: high
      obligations: 신규 벤치마크 기준 무상할당 수령
      costs: 철강 벤치마크 하향으로 무상할당 감소, 배출권 구매 부담 증가
      preparation: 설비별 무상할당 변동 확인, 저배출 공정 전환 검토
      opportunities: fallback 벤치마크 상향안 채택 시 열·연료 기반 공정 할당 일부 회복
    non_eu_producers:
      level: medium
      obligations: 직접 의무 없음
      costs: CBAM 인증서 조정(무상할당 반영분)이 이 벤치마크에 연동되어 실질 CBAM 부담에 영향
      preparation: CBAM 기본값·무상할당 조정 이행규칙(HYS 16933) 초안 공개 시 의견 제출 검토
    korea_note: >
      CBAM 인증서 의무량은 EU 동종 제품의 무상할당(벤치마크 기반)만큼 차감되므로, 2026~2030 철강 벤치마크 하향은 한국산 철강의
      실질 CBAM 부담을 키우는 방향으로 작용한다. CBAM 쪽 벤치마크 정렬 이행규칙(HYS 16933) 초안 의견수렴이 예정돼 있어 공개 시점을 주시할 필요가 있다.
  links:
    commission: "https://climate.ec.europa.eu/areas-action/carbon-markets/eu-emissions-trading-system-eu-ets/free-allocation_en"
