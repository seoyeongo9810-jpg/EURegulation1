      obligations: 개정되는 산정·검증 규칙에 맞춘 배출량 데이터 제공
      preparation: 기본값·벤치마크 개정 반영, 원산지 탄소가격 납부 증빙 체계
      opportunities: 원산지 탄소가격 공제 인정 시 수입자 부담 감소
