- id: cpr
  name_ko: 건설제품규정 개정 (CPR)
  name_en: Construction Products Regulation (CPR)
  status: in_force
  legal_form: Regulation
  legal_ref: "Regulation (EU) 2024/3110"
  dg: GROW
  category: [product_footprint, procurement_market]
  steel_relevance: medium
  effective_date: 2026-01-08
  summary: >
    건설제품 유통 규칙을 개정해 성능·적합성 신고(DoPC)에 GWP 등 전과정 환경지속가능성 정보를 포함하고 디지털 제품여권을 도입하는 규정.
    2025.1.7 발효, 2026.1.8부터 주요 규정 적용. 구 CPR(305/2011)과 장기간 병존하며, 실제 철강 의무는 제품군별 신규 조화기술규격(hEN)과
    위임법령이 인용·채택되는 시점부터 발생한다. 2025.12 작업계획(COM(2025) 772)에 따르면 구조용 금속제품(제품군 20)은 표준화 요청이
    채택되었고, 철근·PC강재(제품군 16)는 표준화 요청 준비 중이다. Commission은 ETS 데이터를 환경성 평가 입력값으로 인정하는 위임법령과
    녹색공공조달 의무 요건 위임법령(2026년 말 영향평가 착수)을 예고했다. 산업가속화법(IAA)·공공조달법 제안이 CPR을 개정하는 안을 포함한다.
  requirements:
    - type: product_info
      text: DoPC에 GWP(총·화석·생물기원·토지이용) 등 부속서 II 환경 필수특성 신고(제품군별 hEN 인용 후)
    - type: carbon_footprint
      text: 제품 단위 LCA 기반 GWP 산정, ETS 데이터 활용 인정 위임법령 예고
    - type: product_info
      text: 디지털 제품여권(DPP) — 위임법령으로 의무화 시
    - type: procurement
      text: 공공조달 최소 환경지속가능성 요건 위임법령 가능(첫 영향평가 2026년 말 착수 예정)
  scope: "철근·PC강재, 구조용 금속제품(형강·강구조 부재 등) 등 조화기술규격 대상 건설용 강재"
  sub_acts:
    - "CPR 작업계획 2026-2029 (COM(2025) 772, 2025.12.16)"
    - "평가·검증체계(AVS) 위임규정 C(2026)3835"
    - "제품군별 표준화 요청 및 등급·임계값 위임법령(구조용 금속제품, 철근·PC강재 등)"
  milestones:
    - date: 2024-12-18
      label: 관보 게재
    - date: 2025-01-07
      label: 발효
    - date: 2025-12-16
      label: CPR 작업계획 2026-2029 발표
    - date: 2026-01-08
      label: 주요 규정 적용 개시
  consultations:
    - type: draft_act_feedback
      title: "COMMISSION DELEGATED REGULATION (EU) …/... supplementing Regulation (EU) 2024/3110 of the European Parliament and of the Council by establishing the applicable assessment and verification systems for product families and categories"
      start: 2025-12-10
      end: 2026-01-07
      summary: 제품군·범주별 평가·검증체계(AVS)와 인증기관 역할을 정하는 위임규정 초안. 이후 C(2026)3835로 채택 게시.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14933-Assessment-and-verification-systems_en"
  impact:
    eu_producers:
      level: medium
      obligations: 신규 hEN 인용 후 GWP 포함 DoPC 발행, CE 마킹
      preparation: EPD·GWP 데이터, 인증기관 대응
      opportunities: 저GWP 제품의 건설 수요처 확보
    non_eu_producers:
      level: medium
      obligations: EU 건설시장 수출 시 동일 신고 의무(수입자·제조자)
      preparation: EN 15804 기반 EPD, 제품 단위 GWP 데이터, DPP 대응
      opportunities: 검증된 저GWP 데이터 보유 시 공공조달에서 유리
    korea_note: >
      철근·형강·강구조재를 EU에 수출하는 경우 신규 조화규격이 인용되는 시점부터 GWP 신고가 의무화된다. 배경 데이터(기본값)는 보수적으로
      설정될 예정이어서 자체 실측 데이터가 없으면 불리할 수 있다. ETS 데이터 활용 위임법령은 EU 설비 중심이므로 비EU 생산자의 데이터 인정 방식을 주시해야 한다.
  links:
    commission: "https://single-market-economy.ec.europa.eu/sectors/construction/construction-products-regulation-cpr_en"
    eurlex: "https://eur-lex.europa.eu/eli/reg/2024/3110/oj"
    have_your_say: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14933-Assessment-and-verification-systems_en"
    guidance: "https://single-market-economy.ec.europa.eu/sectors/construction/construction-products-regulation-cpr/cpr-2024-revision_en"
  related: [espr_steel, industrial_accelerator_act, public_procurement_act]
  verify_needed: true
  note: >
    철강 제품군(16, 20)의 hEN 인용·위임법령 채택 일정은 작업계획 표 해석 불가로 미확인. GWP 신고 의무 개시 시점은 제품군별로 다르며 일자 미확정.
    AVS 위임규정 관보 게재 번호 미확인. effective_date는 seed의 발효일(2025-01-07)에서 적용일(2026-01-08)로 변경.
  last_verified: 2026-10-27

