- id: wsr_scrap_export_list
  name_ko: 폐기물 이동 규정 — 비OECD 국가 비유해폐기물(스크랩) 수출 허용국 목록
  name_en: Waste Shipment Regulation – list of non-OECD countries authorised to import certain non-hazardous waste from the EU
  status: pending
  stage: consultation
  legal_form: Delegated Act
  legal_ref: "Regulation (EU) 2024/1157 위임규정(초안)"
  dg: ENV
  category: [carbon_pricing_trade]
  steel_relevance: medium
  summary: >
    개정 폐기물 이동 규정(Reg. (EU) 2024/1157)에 따라 2027.5.21부터 비OECD 국가로의 비유해(그린리스트) 폐기물 수출이 원칙적으로 금지되며,
    환경적으로 건전한 관리를 입증한 국가만 수입이 허용된다. 이 위임규정은 허용국 목록을 정하며, 철 스크랩의 역외 유출과 EU 내 스크랩 가용성에 영향을 준다.
    초안 피드백은 2026.10.16 마감되었고 2026년 4분기 채택이 계획되어 있다.
  requirements:
    - type: trade_measure
      text: 2027.5.21부터 목록에 없는 비OECD 국가로 철 스크랩 등 비유해 폐기물 수출 금지
  scope: "EU에서 비OECD 국가로 수출되는 비유해(그린리스트) 폐기물, 철 스크랩 포함"
  milestones:
    - date: 2024-05-20
      label: Reg. (EU) 2024/1157 발효
    - date: 2026-10-16
      label: 허용국 목록 위임규정 초안 피드백 마감
    - date: 2027-05-21
      label: 비OECD 국가 비유해폐기물 수출 규정 적용
  consultations:
    - type: draft_act_feedback
      title: "List of non-OECD countries that are authorized to import certain non-hazardous waste from the EU"
      start: 2026-09-18
      end: 2026-10-16
      summary: 비OECD 국가 중 EU 비유해 폐기물 수입을 허용할 국가 목록 초안에 대한 피드백(161건)
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14861_en"
  impact:
    eu_producers:
      level: medium
      obligations: 직접 의무 없음(스크랩 수출업자는 수출 제한 적용)
      opportunities: 역내 철 스크랩 공급 확대로 전기로 원료 확보 유리
    non_eu_producers:
      level: low
      obligations: 목록 미포함 비OECD 국가는 EU산 스크랩 수입 불가
      costs: 비OECD 스크랩 수입국 제강사의 원료 조달 비용 상승 가능
    korea_note: >
      한국은 OECD 회원국이라 비OECD 대상 수출 금지가 직접 적용되지 않는다. 다만 EU 스크랩의 비OECD 유출이 줄면
      국제 철 스크랩 수급·가격이 달라질 수 있어 전기로 원료 조달과 저탄소 철강 전환 계획에 참고가 필요하다.
  links:
