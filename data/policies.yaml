      opportunities: 수입 물량 축소로 역내 공급·가격 보호, 가동률 회복 기대
    non_eu_producers:
      level: high
      obligations: 국가별 쿼터 내 수출, 쿼터 소진 후 50% 관세, 수입 시 melt and pour 증빙 제공
      costs: 쿼터 축소에 따른 수출 물량 감소와 쿼터 소진 시점 관리 부담
      preparation: 품목군별 국가 쿼터·분기 소진 현황 모니터링, Mill Test Certificate에 melt and pour 국가·heat number 기재
      opportunities: 국가별 쿼터를 확보한 공급국은 쿼터 미보유국 대비 상대적 접근성 유지
    korea_note: >
      열연·냉연·도금강판·스테인리스·강관 등 한국의 대EU 주력 수출품이 모두 쿼터 대상이다. 국가별 쿼터(IR 2026/1457)에서 한국 배정량과
      분기별 소진 속도를 품목군별로 관리하고, 쿼터 초과 시 50% 관세가 붙으므로 고객사와 선적 시기를 조율해야 한다.
      2026.10.1부터 Mill Test Certificate에 용해·주조 국가와 heat number 기재가 필수이므로, 수입 슬래브 등을 압연한 제품은 원산지 증빙을 분리 관리해야 한다.
      2027.10.1부터 melt and pour 데이터가 쿼터 배분에 반영되고, 2027.6.30까지 하류제품 확대 여부가 평가되므로 후속 이행규정을 주시해야 한다.
