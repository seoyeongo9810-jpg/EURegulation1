# - 환경 옴니버스 COM(2025) 986 본문(2025/0394(COD)): https://environment.ec.europa.eu/document/download/b45b4ac2-7f40-4b82-acb3-815e134807b6_en?filename=COM_2025_986_1_EN_ACT_part1_v6.pdf
# - OEIL 2025/0394(COD): https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025/0394(COD)
# - HYS API 14794, 16572: https://ec.europa.eu/info/law/better-regulation/brpapi/groupInitiatives/14794 , .../16572
# ------------------------------------------------------------
- id: ied
  name_ko: 산업·축산 배출지침 개정 (IED 2.0)
  name_en: Industrial and Livestock Rearing Emissions Directive (IED 2.0)
  status: in_force
  stage: adopted
  legal_form: Directive
  legal_ref: "Directive (EU) 2024/1785 (Directive 2010/75/EU 개정)"
  dg: ENV
  category: [industrial_emissions]
  steel_relevance: medium
  effective_date: 2024-08-04
  summary: >
    최적가용기법(BAT)에 기반해 산업시설을 허가하는 지침의 개정. 2024-08-04 발효, 회원국 전환 기한 2026-07-01.
    환경관리시스템(EMS) 의무화(2027-07-01까지), 철강 등 에너지집약 업종의 전환계획(Transformation plan) EMS 포함(2030-06-30까지),
    가장 엄격한 달성 가능한 배출한도 설정, 위반 시 연매출 3% 이상 과징금 등을 도입했다.
    다만 2025-12-10 Commission 환경 옴니버스(COM(2025) 986)가 전환계획 의무 삭제, EMS 기한 2030년 연기 등을 제안해 의회 심의 중이다.
  requirements:
    - type: bat_limits
      text: BAT 결론에 따른 허가 조건 준수, 2026-07-01 이후 공표 BAT 결론부터 가장 엄격한 달성 가능 배출한도 적용
    - type: mrv
      text: "설비별 EMS 수립·이행 및 최초 감사(현행 기한 2027-07-01) — 옴니버스안은 2030년으로 연기 제안"
    - type: mrv
      text: "철강(Annex I 2항 금속) 등 지정 업종은 2030-06-30까지 EMS에 지표적 전환계획(2030~2050) 포함 — 옴니버스안은 삭제 제안"
  scope: "EU 역내 철강 생산시설(선철·조강 2.5t/h 초과, 코크스, 소결 등 Annex I 활동)"
  sub_acts:
    - "환경 옴니버스 Directive 제안 COM(2025) 986 / 2025/0394(COD) — IED EMS·전환계획 등 간소화"
    - "전환계획 내용 위임법령(Art.27d(5), 법정 채택기한 2026-06-30) — 채택 여부 미확인"
    - "INCITE(산업전환·배출 혁신센터) 운영 이행결정 — 초안 의견수렴 예정(HYS 16572)"
    - "철강 BAT 결론(Implementing Decision 2012/135/EU) 개정 작업 — steel_bref 참고"
  milestones:
    - date: 2024-08-04
      label: 개정 지침 발효
    - date: 2025-12-10
      label: Commission 환경 옴니버스(COM(2025) 986) 제안 — IED 간소화 포함
    - date: 2026-07-01
      label: 회원국 국내법 전환 기한
    - date: 2026-12-14
      label: 옴니버스 유럽의회 1독회 본회의 예정일(OEIL 예측, 잠정)
    - date: 2027-07-01
      label: "EMS 수립·이행 및 최초 감사 기한(현행법)"
    - date: 2030-06-30
      label: "지정 업종 전환계획 EMS 포함 기한(현행법, 옴니버스안은 삭제 제안)"
  consultations:
    - type: call_for_evidence
      title: "Proposals for a Regulation and for a Directive of the European Parliament and of the Council on the simplification of administrative burden in environmental legislation"
      start: 2025-07-22
      end: 2025-09-10
      summary: 폐기물·제품·산업배출 분야 행정부담 간소화(환경 옴니버스) Call for Evidence
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14794-Simplification-of-administrative-burdens-in-environmental-legislation_en"
    - type: draft_act_feedback
      title: "COMMUNICATION FROM THE COMMISSION TO THE EUROPEAN PARLIAMENT, THE COUNCIL, THE EUROPEAN ECONOMIC AND SOCIAL COMMITTEE AND THE COMMITTEE OF THE REGIONS Simplifying for sustainable competitiveness"
      start: 2026-03-12
      end: 2026-05-07
      summary: 환경 옴니버스 패키지(COM(2025) 980 및 IED 개정안 COM(2025) 986 등)에 대한 피드백(214건)
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14794-Simplification-of-administrative-burdens-in-environmental-legislation_en"
  impact:
    eu_producers:
      level: medium
      obligations: 허가 조건·EMS 준수, (현행법 기준) 2030년까지 전환계획 수립
      costs: BAT 결론 개정 시 설비 개선 투자, EMS 감사 비용
      preparation: 옴니버스 협상 결과에 따른 EMS·전환계획 의무 변화 확인, 철강 BREF 개정 대응
      opportunities: 심층 산업전환 시 허가조건 준수 기한 최대 8년 연장(Art.27e)
    non_eu_producers:
      level: low
      obligations: 직접 의무 없음
      costs: EU 경쟁사의 환경 규제비용 상승에 따른 간접 영향
    korea_note: >
      IED는 EU 역내 설비에만 적용되어 한국 철강사의 대EU 수출에는 직접 의무가 없다. 다만 EU 내 생산·가공 거점(합작·인수 포함)을
      보유하거나 검토 중이라면 2026-07-01 이후 회원국 국내법, EMS 기한, 철강 BREF 개정에 따른 배출한도 강화를 고려해야 한다.
      옴니버스로 전환계획 의무가 삭제될지 여부도 확인이 필요하다.
  links:
    commission: "https://environment.ec.europa.eu/topics/industrial-emissions-and-safety/industrial-and-livestock-rearing-emissions-directive-ied-20_en"
    eurlex: "https://eur-lex.europa.eu/eli/dir/2024/1785/oj"
    have_your_say: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14794-Simplification-of-administrative-burdens-in-environmental-legislation_en"
    oeil: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025/0394(COD)"
  related: [steel_bref, ets_review]
  verify_needed: true
  note: >
    전환 기한(2026-07-01)·EMS 기한(2027-07-01)·전환계획(2030-06-30, 위임법령 2026-06-30)은 비공식 통합본과 옴니버스 제안서 기준이며,
    EUR-Lex 원문은 직접 조회하지 못함. 전환계획 위임법령 채택 여부, 회원국 전환 현황, 옴니버스(2025/0394(COD)) 이사회 입장은
    미확인(OEIL상 '위원회 결정 대기'). 옴니버스 개별 제안서의 HYS 피드백은 비활성 상태이며, 피드백은 Communication(COM(2025) 980) 단위로 진행됨.
  last_verified: 2026-10-27

