      '실제 납부' 가격과 증빙·독립 인증이 필요하므로, 최종 채택 문안의 증빙 형식에 맞춰 설비·제품별 K-ETS 납부 내역을 정리해야 한다.
      한국산 열연·냉연·도금·스테인리스 기본값(2026/1740 정정 반영)과 ETS 2026~2030 벤치마크 반영 개정(2026년 4분기 계획)도 수입자 부담에 영향을 주므로 확인이 필요하다.
