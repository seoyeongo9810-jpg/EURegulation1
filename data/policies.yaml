# - 네덜란드 정부 IPLO BREF 일정표(킥오프 2026년 11~12월 계획, 비EU 출처): https://iplo.nl/regelgeving/regels-voor-activiteiten/toelichting-milieubelastende-activiteiten/vergunning-milieubelastende-activiteit/ippc/stand-komen-bref-bbt-conclusies/
# - EEB 의견(2026-08): https://eeb.org/wp-content/uploads/2026/08/EEB-response-to-the-review-of-the-Iron-and-Steel-BREF.pdf
# ------------------------------------------------------------
- id: steel_bref
  name_ko: 철강 BREF 개정 (IED BAT 결론)
  name_en: Iron and Steel Production BREF review (BAT conclusions under IED)
  status: pending
  stage: preparation
  legal_form: Implementing Act
  legal_ref: "현행: Commission Implementing Decision 2012/135/EU (철강 BAT 결론)"
  dg: ENV
  category: [industrial_emissions]
  steel_relevance: high
  summary: >
    산업배출지침에 따른 철강 생산 최적가용기법 참고문서(IS BREF)와 BAT 결론 개정. 현행 BAT 결론은 2012년 채택돼
    수소 직접환원(DRI) 등 신규 저탄소 공정을 반영하지 못한다. JRC EU-BRITE가 2026-03-06 기술작업반(TWG)을 재가동해
    개정 작업이 시작됐으며, 현재 사전 정보 수집(frontloading) 단계다. 개정 BAT 결론은 IED 2.0의 강화된 배출한도 규칙이 적용된다.
  requirements:
    - type: bat_limits
      text: 코크스·소결·고로·제강 공정 BAT-AEL(배출한도) 재설정, 신규 공정(수소 DRI 등) 반영 검토
    - type: bat_limits
      text: BAT 결론 공표 후 4년 내 역내 허가조건 재검토·적용(IED 원칙)
  scope: "EU 역내 코크스 생산, 철광석 소결·배소, 선철·조강 생산(2.5t/h 초과) 설비"
  sub_acts:
    - "Commission Implementing Decision 2012/135/EU — 현행 철강 BAT 결론"
    - "Commission Implementing Decision (EU) 2022/2110 — 철강 가공(FMP) BAT 결론(별도 문서)"
  milestones:
    - date: 2026-03-06
      label: 철강 BREF 개정 착수(기술작업반 재가동)
  consultations: []
  impact:
    eu_producers:
      level: medium
      obligations: 개정 BAT 결론 공표 후 허가조건 재검토 및 배출한도 준수
      costs: 대기오염물질 저감 설비 개선 투자
      preparation: TWG 정보 제출(업계 협회 경유), 신규 공정 BAT 반영 대응
      opportunities: 수소 DRI·전기로 등 저탄소 공정이 BAT로 인정될 경우 전환 투자 허가 용이
    non_eu_producers:
      level: low
      obligations: 직접 의무 없음
      costs: EU 경쟁사의 환경 규제비용 변화에 따른 간접 영향
    korea_note: >
      BREF는 EU 역내 설비 허가 기준으로 한국 수출품에 직접 적용되지 않는다. 다만 BREF는 세계 철강 환경기준의 참고자료로 쓰이므로
      한국 규제(통합환경관리제도 BAT 기준서) 개정 방향에도 참고가 될 수 있고, 수소환원제철 등 신규 공정의 BAT 반영 여부는
      기술 동향 측면에서 주시할 가치가 있다. EU 역내 생산 거점이 있다면 개정 일정을 추적해야 한다.
  links:
    commission: "https://bureau-industrial-transformation.jrc.ec.europa.eu/reference/iron-and-steel-production-0"
    eurlex: "https://eur-lex.europa.eu/eli/dec_impl/2012/135/oj"
  related: [ied]
  verify_needed: true
  note: >
    2026-03-06 TWG 재가동은 EU-BRITE 공식 뉴스로 확인. 킥오프 회의는 네덜란드 IPLO 일정표상 2026년 11~12월 계획이나 공식 일정 미공표로 milestones에 넣지 않음.
    초안(D1)·최종회의·BAT 결론 채택 예정 시점은 미확인. FMP BAT 결론 번호 (EU) 2022/2110은 이번 조사에서 원문 재확인하지 못함.
  last_verified: 2026-10-27

