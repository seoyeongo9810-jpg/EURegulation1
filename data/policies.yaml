- id: industrial_decarbonisation_bank
  name_ko: 산업탈탄소은행 (IDB) 및 파일럿 경매
  name_en: Industrial Decarbonisation Bank (IDB) and pilot auctions
  status: pending
  stage: preparation
  legal_form: Other
  dg: CLIMA
  category: [funding_support]
  steel_relevance: low
  summary: >
    청정산업딜에서 발표한 1,000억 유로 규모 산업 탈탄소 자금 조달 이니셔티브로 혁신기금, ETS 일부 수입, InvestEU 개정을 재원으로 하며
    향후 경쟁력기금 거버넌스에 편입될 예정이다. 파일럿으로 혁신기금 IF25 산업 공정열 탈탄소 경매(10억 유로, 2025.10.10 조건 공고)가 시행되었고,
    2026.9.24 IF26 열 경매(10억 유로) 조건이 공고되어 2026.12 초 입찰 개시가 예정되어 있다. 철강을 포함한 EEA 내 모든 산업 부문이 대상이다.
  requirements: []
  scope: "EEA 내 산업 탈탄소 프로젝트(철강 포함). 비EU 생산자는 대상 아님"
  sub_acts:
    - "혁신기금 IF25 산업 공정열 탈탄소 파일럿 경매"
    - "혁신기금 IF26 산업 공정열 경매"
  milestones:
    - date: 2025-10-10
      label: IF25 파일럿 경매 조건 공고
    - date: 2026-02-19
      label: IF25 경매 신청 마감
    - date: 2026-09-24
      label: IF26 열 경매 조건 공고
  consultations: []
  impact:
    eu_producers:
      level: medium
      opportunities: 탈탄소 설비 투자 보조(경매 방식)
      preparation: 경매 입찰 준비
    non_eu_producers:
      level: low
      obligations: 직접 의무 없음
      costs: EU 경쟁사의 저탄소 전환 가속에 따른 간접 경쟁 영향
    korea_note: >
      한국 철강사는 지원 대상이 아니다. EU 경쟁사의 수소환원·전기화 투자에 대한 공적 지원이 확대되면 EU 시장의 저탄소 철강 공급이 늘어
      IAA·ESPR의 저탄소 요건과 맞물려 한국산 제품의 상대적 경쟁 조건에 영향을 줄 수 있다.
  links:
    commission: "https://single-market-economy.ec.europa.eu/industry/sustainability/net-zero-industry-act/net-zero-navigator/list-instruments/industrial-decarbonisation-bank_en"
    guidance: "https://climate.ec.europa.eu/news-other-reads/news/commission-publishes-terms-and-conditions-eur1-billion-industrial-heat-decarbonisation-auction-2026-09-24_en"
  related: [steel_metals_action_plan, ets_review]
  verify_needed: true
  note: >
    신규 추가 항목. IDB 자체의 법적 근거·입법 형식 미확인(Commission 페이지에 미기재, 경쟁력기금·ETS 개정과 연계 예정).
    IF25 신청 마감일(2026-02-19)은 2차 출처 기반. IF26 입찰 개시일은 '2026.12 초'로만 공지되어 날짜 미기재. 철강 관련성은 한국 수출 관점에서 low로 판단.
  last_verified: 2026-10-27
