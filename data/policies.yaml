- id: espr
  name_ko: 에코디자인 규정 (ESPR)
  name_en: Ecodesign for Sustainable Products Regulation (ESPR)
  status: in_force
  legal_form: Regulation
  legal_ref: "Regulation (EU) 2024/1781"
  dg: GROW
  category: [product_footprint]
  steel_relevance: medium
  effective_date: 2024-07-18
  summary: >
    EU 시장에 출시되는 제품의 지속가능성 요건(내구성·재활용성·재활용 함량·탄소/환경발자국·정보 요건)과
    디지털 제품여권(DPP)을 위임법령으로 정하는 프레임워크 규정. 2025~2030 작업계획(COM(2025) 187)에서
    철강을 우선 중간재로 지정했고, 2026.5 철강 위임법령 Call for Evidence·공개협의가 진행·마감되었다(espr_steel 참고).
    2026.2 미판매 소비재(의류·신발) 폐기금지 관련 위임·이행법령이 채택되었고, DPP 레지스트리 이행규정 초안 피드백이 2026.5 마감되었다.
    2026.9 제안된 공공조달법(COM(2026) 590)은 ESPR의 녹색공공조달 조항(제65조)을 공공조달법 제54조로 이관하는 안을 담고 있다.
  requirements:
    - type: product_info
      text: 제품군별 위임법령으로 성능·정보 요건(탄소·환경발자국, 재활용 함량, 우려물질) 및 디지털 제품여권(DPP) 도입
    - type: labelling
      text: 위임법령에 따라 성능 등급·라벨 도입 가능
    - type: procurement
      text: 위임법령에 근거한 녹색공공조달 의무 요건 설정 가능(공공조달법 제안 시 해당 법으로 이관 예정)
  scope: "EU 시장 출시 제품 전반(식품·의약품 등 제외). 철강은 철강 위임법령 채택·적용 후 대상"
  sub_acts:
    - "ESPR·에너지라벨 작업계획 2025-2030 (COM(2025) 187)"
    - "철강 제품 에코디자인 위임법령(준비 중, espr_steel)"
    - "미판매 소비재 폐기금지 예외 위임규정·공개양식 이행규정 (2026.2.9 채택)"
    - "DPP 레지스트리 이행규정(초안 피드백 2026.4.29~5.27)"
    - "DPP 서비스 제공자 위임법령(준비 중)"
  milestones:
    - date: 2024-06-28
      label: 관보 게재
    - date: 2024-07-18
      label: 발효
    - date: 2026-02-09
      label: 미판매 의류·신발 폐기금지 관련 위임·이행법령 채택
    - date: 2026-05-20
      label: 철강 위임법령 Call for Evidence·공개협의 개시
  consultations:
    - type: draft_act_feedback
      title: "COMMISSION IMPLEMENTING REGULATION (EU) …/... laying down the implementation arrangements for the digital product passport registry set up under Regulation (EU) 2024/1781"
      start: 2026-04-29
      end: 2026-05-27
      summary: DPP 레지스트리 운영 세부 규칙 이행규정 초안. 철강 DPP 도입 시 등록 체계의 기반이 된다.
      url: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/16052-Digital-Product-Passport-Registry-DPP-_en"
  impact:
    eu_producers:
      level: medium
      obligations: 제품군별 위임법령 채택 후 성능·정보 요건 및 DPP 준수
      preparation: 제품 단위 탄소발자국·재활용 함량 데이터 체계 구축
      opportunities: 저탄소·고재활용 제품의 시장 차별화
    non_eu_producers:
      level: medium
      obligations: EU 시장 출시 제품에 역내산과 동일 적용(수입자·제조자 책임)
      preparation: 제품 단위 데이터 산정·제공, DPP 데이터 연계
      opportunities: 데이터 투명성 확보 시 동등한 시장 접근
    korea_note: >
      ESPR 자체는 프레임워크이며 철강에 대한 실제 의무는 철강 위임법령(espr_steel)으로 발생한다.
      한국 철강사는 CBAM용 설비 단위 배출 데이터와 별개로 제품 단위 탄소발자국·재활용 함량·DPP 데이터 요구에 대비해야 하며,
      자동차·가전 등 하류 제품 위임법령을 통해 고객사로부터 소재 데이터 요청이 먼저 올 수 있다.
  links:
    commission: "https://environment.ec.europa.eu/strategy/circular-economy/ecodesign-sustainable-products-regulation_en"
    eurlex: "https://eur-lex.europa.eu/eli/reg/2024/1781/oj"
    have_your_say: "https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/17672-Ecodesign-requirements-for-iron-and-steel-products_en"
  related: [espr_steel, cpr, industrial_accelerator_act, public_procurement_act]
  verify_needed: true
  note: >
    작업계획 채택일(2025.4.16로 알려짐)과 2026.2 채택 법령의 번호(C(2026) 659/660 vs (EU) 2026/296 등 출처 불일치)는
    EUR-Lex 접속 불가로 미확인. DPP 레지스트리 이행규정 채택 여부 미확인.
  last_verified: 2026-10-27

