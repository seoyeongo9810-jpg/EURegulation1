# 정책 데이터 변경 이력 (최신순으로 표시됨)
# policy_id가 없으면 전체 데이터에 대한 변경

- date: 2026-10-27
  summary: 공식 출처(Commission·OEIL·Have Your Say·Council) 조사로 정책 17건 갱신, 신규 9건 추가(총 26건, 시행 중 13·제정 중 13), 의견수렴 38건 입력. EUR-Lex 본문은 자동 조회 차단으로 직접 확인하지 못함.

- date: 2026-10-27
  policy_id: cbam
  summary: 철강은 직접배출만 대상(간접배출 제외)으로 정정. 인증서 판매 2027.2.1, 첫 신고 2027.9.30, 분기 50% 보유, 기본값 mark-up 일정, 채택된 이행·위임법령 목록 추가.

- date: 2026-10-27
  policy_id: cbam_downstream
  summary: 입법 단계 제안 → 트릴로그. COM(2025) 989, 이사회 일반접근(2026.6.12)·의회 1독 입장(2026.9.15) 반영. 종료된 의견수렴 2건 추가.

- date: 2026-10-27
  policy_id: cbam_export
  summary: "'수출 관련 조치'를 실제 제안인 임시 탈탄소 기금(TDF, COM(2025) 990)으로 재정의."

- date: 2026-10-27
  policy_id: cbam_secondary_acts
  summary: 입법 단계 준비 → 의견수렴. 제3국 탄소가격 공제·인증서 판매 초안 피드백 등 의견수렴 5건, 채택·제정 중·계획 법령 구분.

- date: 2026-10-27
  policy_id: steel_trade_measure
  summary: Regulation (EU) 2026/1384 채택·2026.7.1 적용 확인. 쿼터 18,345,922톤·50% 관세, melt and pour 증빙(2026.10.1) 및 검토 일정 추가.

- date: 2026-10-27
  policy_id: eu_ets
  summary: 2026~2030 벤치마크(Implementing Reg. 2026/1412) 반영, Commission 링크 최신 주소로 변경.

- date: 2026-10-27
  policy_id: ets_review
  summary: 입법 단계 의견수렴 → Commission 제안(COM(2026) 616, 2026.7.17). 진행 중 피드백(2026.11.3 마감) 추가.

- date: 2026-10-27
  policy_id: climate_law_2040
  summary: Regulation (EU) 2026/667로 채택·발효(2026.4.7) 확인. 2040 -90%, 국제 크레딧 최대 5%p, ETS2 2028 연기 반영.

- date: 2026-10-27
  policy_id: ied
  summary: 국내법 전환·EMS·전환계획 기한 추가. 전환계획 삭제 등을 담은 환경 옴니버스 제안(COM(2025) 986) 반영.

- date: 2026-10-27
  policy_id: steel_bref
  summary: 2026.3.6 기술작업반 재가동으로 검토 개시 확인. 철강 관련도 상향(중 → 상).

- date: 2026-10-27
  policy_id: red3
  summary: Commission 링크 갱신, 수소 산정 위임법령 추가. 공식 출처로 확인하지 못한 산업용 RFNBO 42% 수치 삭제.

- date: 2026-10-27
  policy_id: elv_regulation
  summary: Regulation (EU) 2026/1738로 채택(관보 2026.7.24) 확인 → 시행 중으로 이동. 2028.9.1 적용, 철강 관련도 상향(하 → 중).

- date: 2026-10-27
  policy_id: espr_steel
  summary: 입법 단계 준비 → 의견수렴. Call for Evidence·공개협의(2026.5.20~8.12) 추가, 2026년 4분기 채택 계획.

- date: 2026-10-27
  policy_id: espr
  summary: Commission 링크가 404여서 DG ENV의 새 ESPR 페이지로 교체. 2026년 하위 조치와 DPP 등록부 피드백 추가.

- date: 2026-10-27
  policy_id: industrial_accelerator_act
  summary: COM(2026) 100(2026.3.4 제안) 확인. 의견수렴 3건, 공공조달 저탄소 철강 요건(언론 기준, 원문 확인 필요) 반영.

- date: 2026-10-27
  policy_id: cpr
  summary: 시행일을 발효일(2025.1.7)에서 적용일(2026.1.8)로 정정. 2026~2029 작업계획의 철강 제품군 반영.

- date: 2026-10-27
  policy_id: nzia
  summary: 공공조달 최소 요건 등 이행규정 3건 추가.

- date: 2026-10-27
  summary: "신규 추가 9건: 폐기물 이동 규정 스크랩 수출 허용국(wsr_scrap_export_list), ETS 벤치마크 2026~2030(ets_benchmarks_2026_2030), 수소 전략(hydrogen_strategy), 저탄소 수소 산정 위임법령(hydrogen_ghg_methodology), 2030 이후 재생에너지 체계(renewables_post2030), 철강·금속 행동계획(steel_metals_action_plan), 공공조달법(public_procurement_act), 순환경제법(circular_economy_act), 산업탈탄소은행(industrial_decarbonisation_bank)"

